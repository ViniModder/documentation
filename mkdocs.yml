site_name: Combo Late Game
site_description: Sistema completo de partidas competitivas para FiveM
site_author: Combo Store
site_url: https://seuusuario.github.io/combo-lategame

# Repository
repo_url: https://github.com/seuusuario/combo-lategame
repo_name: combo-lategame

# Copyright
copyright: Copyright &copy; 2024 Combo Store

# Theme
theme:
  name: material
  language: pt
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo claro

    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo escuro

  # Features
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

  # Logo and favicon
  logo: images/logo.png
  favicon: images/favicon.png

  # Font
  font:
    text: Roboto
    code: Roboto Mono

# Plugins
plugins:
  - search:
      lang:
        - pt

# Navigation
nav:
  - Início:
    - index: index.mdx
  - Documentação:
    - apresentacao: apresentacao.mdx
  - Guias:
    - instalacao: instalacao.mdx
    - configuracao: configuracao.mdx
  - Desenvolvedores:
    - api: api.mdx

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Extra JavaScript
extra_javascript:
  - javascripts/extra.js

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/seuusuario/combo-lategame
    - icon: fontawesome/brands/discord
      link: https://discord.gg/seudiscord
